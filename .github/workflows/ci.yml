name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: |
          git ls-files 'Source/*.h' 'Source/*.cpp' 'Tests/*.h' 'Tests/*.cpp' 'Tools/*.h' 'Tools/*.cpp' \
            | xargs clang-format-18 --dry-run --Werror

  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            werror: ON
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            werror: ON
          - name: windows-msvc
            os: windows-latest
            werror: OFF
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -DHG_CORE_ONLY=ON -DHG_WARNINGS_AS_ERRORS=${{ matrix.werror }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-app:
    name: game + editor (linux)
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Axmol toolchain
        run: echo "y" | pwsh axmol/setup.ps1

      - name: Build
        shell: pwsh
        run: ./axmol/tools/cmdline/axmol -p linux -a x64 -xc '-Bbuild/linux' -t 'hg_tests,hg_tool,HorrorGameEditor,HorrorGame'

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure
